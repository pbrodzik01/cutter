name: CLI smoke
on:
  push:
    branches: [test/actions-smoke]
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/build.mjs
      - run: npx playwright-core install --with-deps chromium
      - name: Machine
        run: |
          nproc
          free -h
          lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: Serve the motion page
        run: (cd .github/smoke && python3 -m http.server 8099 >/dev/null 2>&1 &) ; sleep 2
      - name: One capture
        run: |
          mkdir -p out
          time node dist/cli/cutter.cjs capture --spec .github/smoke/motion.yaml --out out/one --json > out/one.json
      - name: Four captures at once
        run: |
          time (
            for i in 1 2 3 4; do
              node dist/cli/cutter.cjs capture --spec .github/smoke/motion.yaml --out "out/p$i" --json > "out/p$i.json" 2>&1 &
            done
            wait
          )
      - name: Four renders at once
        run: |
          time (
            for i in 1 2 3 4; do
              node dist/cli/cutter.cjs render "out/p$i/clip.mp4" --max-width 1920 --out "out/p$i/final.mp4" > /dev/null 2>&1 &
            done
            wait
          )
      - name: Results
        if: always()
        run: |
          node -e "
          const fs = require('fs')
          for (const name of ['one','p1','p2','p3','p4']) {
            const file = 'out/' + name + '/capture.json'
            if (!fs.existsSync(file)) { console.log(name, 'missing'); continue }
            const video = JSON.parse(fs.readFileSync(file)).outputs.find(output => output.kind === 'video')
            console.log(name, 'seconds', video.seconds, 'frames', video.frames, 'motionFps', video.motionFps)
          }"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-output
          path: |
            out/p1/final.mp4
            out/p4/final.mp4
          if-no-files-found: warn
